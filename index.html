<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesis Client</title>
<style>
:root{color-scheme:dark;--purple:#a66cff;--purple2:#6838bf;--green:#42e58c;--panel:rgba(12,9,24,.76)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#f7f1ff;background:#080612;overflow-x:hidden}
.bg{position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,3,14,.22),rgba(5,3,14,.86)),url('assets/mesis-mountain.png') center/cover no-repeat;filter:saturate(1.15) contrast(1.05);transform:scale(1.04)}
main{position:relative;min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:min(640px,94vw);border:1px solid rgba(176,118,255,.42);border-radius:26px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 28px 90px rgba(79,32,150,.35);padding:28px}
.top{display:flex;gap:18px;align-items:center}.icon{width:86px;height:86px;border-radius:50%;object-fit:cover;border:2px solid #c490ff;box-shadow:0 0 30px rgba(166,108,255,.45)}h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:.04em}.version{color:#b8aec8;margin-top:5px}.status{display:flex;align-items:center;gap:8px;margin-top:8px;color:#dcd3e8}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}blockquote{margin:26px 0 20px;font-size:clamp(18px,3vw,25px);font-style:italic;color:#e3d5f7}.actions{display:flex;gap:12px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:white;padding:12px 17px;border-radius:14px;border:1px solid rgba(193,148,255,.28);background:linear-gradient(180deg,rgba(132,73,210,.7),rgba(74,37,126,.72));font-weight:700}.discordMark{width:22px;height:16px;border-radius:7px;background:#fff;position:relative}.discordMark:before,.discordMark:after{content:'';position:absolute;top:6px;width:3px;height:3px;border-radius:50%;background:#6d43bd}.discordMark:before{left:6px}.discordMark:after{right:6px}.fine{margin-top:22px;color:#988da9;font-size:13px}
</style>
</head>
<body><div class="bg"></div><main><section class="card"><div class="top"><img class="icon" src="assets/mesis-icon.png" alt="Mesis"><div><h1>Mesis Client</h1><div class="version">V25.1</div><div class="status"><span class="dot"></span> Ready to play</div></div></div><blockquote>“Same game. A better you.”</blockquote><div class="actions"><a class="btn" href="https://discord.gg/FAURnhhvBd"><span class="discordMark"></span>Join Discord</a></div><div class="fine">Mesis • clean purple-night interface • community build</div></section></main></body>
</html>
